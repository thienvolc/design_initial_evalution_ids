profiles:
  _base_local:
    description: Shared defaults for the current local machine (6 CPU cores, 10 GB RAM)
    args:
      config: configs/streaming/online_scale_up.yaml

  smoke_gate:
    extends: _base_local
    description: Fast smoke gate for local verification before longer runs
    runtime: docker
    script: scripts/streaming/run_layer_b_matrix.py
    mode: official
    resource_class: light
    meta:
      pass_fail:
        required: true
        min_rows_total: 20000
        max_fnr: 0.40
        max_fpr: 0.20
    args:
      warmup_rows: 15000
      warmup_rate_schedule: "1000:15"
      models: [logistic_regression]
      feature_sets: [full]
      repeats: 1
      max_rows: 25000
      batch_size: 2000
      metrics_timeout_sec: 300
      run_prefix: smoke_local
      summary_csv: artifacts/streaming/scale_up/layer_b_summary_smoke_local.csv

  layer_a_local_light:
    extends: layer_a_local_medium
    description: Backward-compatible alias for the current local Layer A regression profile

  layer_a_local_medium:
    extends: _base_local
    description: Local Layer A profile set sized for a 6-core / 10 GB machine
    runtime: docker
    script: scripts/streaming/run_layer_a_matrix.py
    mode: official
    resource_class: medium
    meta:
      rows_logic:
        max_rows_is_per_profile: true
        profile_count: 3
        expected_main_rows_total: 210000
        warmup_rows_per_profile: 20000
        expected_warmup_rows_total: 60000
      rate_schedule_note: schedule is a throughput envelope; replay stops early at max_rows per profile
      pass_fail:
        required: false
        min_rows_total: 180000
        max_e2e_p95_ms: 90000
        min_rows_per_sec_avg: 120
    args:
      model: logistic_regression
      feature_set: full
      trace_input_parquet: data/gold/splits/test.parquet
      trace_order_column: event_time
      trace_rate_schedule: "2000:90,4000:60"
      trace_stream_run_seconds: 0
      warmup_rows: 20000
      warmup_rate_schedule: "800:25"
      profiles:
        - name: A_low
          max_offsets_per_trigger: 300
          shuffle_partitions: 3
          trigger_interval: "10 seconds"
        - name: A_mid
          max_offsets_per_trigger: 1200
          shuffle_partitions: 6
          trigger_interval: "10 seconds"
        - name: A_high
          max_offsets_per_trigger: 3200
          shuffle_partitions: 8
          trigger_interval: "10 seconds"
      repeats: 1
      max_rows: 70000
      batch_size: 2000
      metrics_timeout_sec: 900
      run_prefix: layerA_local_medium
      summary_csv: artifacts/streaming/scale_up/layer_a_summary_local_medium.csv

  layer_b_light:
    extends: layer_b_local_medium
    description: Backward-compatible alias for the current local Layer B regression profile

  layer_b_local_medium:
    extends: _base_local
    description: Local Layer B comparison with a scaled curated model set
    runtime: docker
    script: scripts/streaming/run_layer_b_matrix.py
    mode: official
    resource_class: medium
    meta:
      rows_logic:
        max_rows_is_per_combo: true
        combo_count: 3
        expected_main_rows_total: 150000
        warmup_rows_per_combo: 20000
        expected_warmup_rows_total: 60000
      combo_policy:
        selected_pairs:
          - "logistic_regression:full"
          - "random_forest:full"
          - "gradient_boosting:full"
      pass_fail:
        required: false
        min_rows_total: 120000
        max_fnr: 0.35
        max_fpr: 0.15
    args:
      trace_input_parquet: data/gold/splits/test.parquet
      trace_order_column: event_time
      trace_rate_schedule: "2000:90,4000:60"
      trace_stream_run_seconds: 240
      warmup_rows: 20000
      warmup_rate_schedule: "800:25"
      model_feature_pairs:
        - "logistic_regression:full"
        - "random_forest:full"
        - "gradient_boosting:full"
      repeats: 1
      max_rows: 50000
      batch_size: 2000
      metrics_timeout_sec: 900
      metrics_idle_sec: 20
      run_prefix: layerB_local_medium
      summary_csv: artifacts/streaming/scale_up/layer_b_summary_local_medium.csv

  watermark_local_light:
    extends: watermark_local_medium
    description: Backward-compatible alias for the current local watermark regression profile

  watermark_local_medium:
    extends: _base_local
    description: Local watermark profile with scaled volume and three delay settings
    runtime: docker
    script: scripts/streaming/run_watermark_matrix.py
    mode: official
    resource_class: medium
    meta:
      pass_fail:
        required: false
        min_rows_total: 120000
        max_fnr: 0.40
        max_fpr: 0.20
    args:
      model: logistic_regression
      feature_set: full
      trace_input_parquet: data/gold/splits/test.parquet
      trace_order_column: event_time
      trace_rate_schedule: "2000:90,4000:60"
      warmup_rows: 20000
      warmup_rate_schedule: "800:25"
      watermark_delays: [0, 10, 30]
      drop_late_events: true
      max_rows: 50000
      batch_size: 2000
      metrics_timeout_sec: 1200
      metrics_idle_sec: 20
      summary_csv: artifacts/streaming/scale_up/watermark_summary_local_medium.csv

  layer_c_local_light:
    extends: layer_c_local_medium
    description: Backward-compatible alias for the current local Layer C regression profile

  layer_c_local_medium:
    extends: _base_local
    description: Local Layer C fault profile with scaled recovery pressure
    runtime: host
    script: scripts/streaming/run_layer_c_matrix.py
    mode: official
    resource_class: medium
    meta:
      pass_fail:
        required: false
        min_recovery_events: 2
        max_recovery_seconds: 180
    args:
      execution_mode: docker
      model: logistic_regression
      feature_set: full
      scenarios: [kafka_restart, spark_process_restart, producer_restart]
      warmup_rows: 30000
      warmup_rate_schedule: "2000:15"
      post_fault_rows: 80000
      post_fault_rows_per_sec: 4000
      batch_size: 1000
      producer_restart_pause_sec: 2
      replay_retries: 6
      replay_retry_wait_sec: 4
      startup_wait_sec: 60
      metrics_timeout_sec: 900
      stream_run_seconds: 600
      summary_csv: artifacts/streaming/scale_up/layer_c_summary_local_medium.csv

  stress_local_light:
    extends: stress_local_medium
    description: Backward-compatible alias for the current local load-quality regression profile

  stress_local_medium:
    extends: _base_local
    description: Local load-quality profile with scaled low/medium/high load steps
    runtime: docker
    script: scripts/streaming/run_load_quality_matrix.py
    mode: official
    resource_class: medium
    meta:
      pass_fail:
        required: false
        min_rows_total: 80000
        min_rows_per_sec_actual: 150
        max_lag_records_peak: 20000
    args:
      model: logistic_regression
      feature_set: full
      load_profiles:
        - "low:2000:20000"
        - "medium:4000:30000"
        - "high:8000:40000"
      warmup_rows: 20000
      warmup_rate_schedule: "800:25"
      batch_size: 3000
      metrics_timeout_sec: 1200
      metrics_idle_sec: 20
      summary_csv: artifacts/streaming/scale_up/load_quality_summary_local_medium.csv

  layer_b_local_extended:
    extends: layer_b_local_medium
    description: Optional longer local Layer B run when the machine is free
    mode: ablation
    resource_class: heavy
    meta:
      pass_fail:
        required: false
    args:
      trace_rate_schedule: "3000:120,6000:60"
      trace_stream_run_seconds: 300
      warmup_rows: 25000
      warmup_rate_schedule: "1000:25"
      max_rows: 70000
      batch_size: 3000
      metrics_timeout_sec: 1200
      summary_csv: artifacts/streaming/scale_up/layer_b_summary_local_extended.csv

  stress_local_extended:
    extends: stress_local_medium
    description: Optional burstier local stress profile for ad hoc investigation
    mode: ablation
    resource_class: heavy
    meta:
      pass_fail:
        required: false
    args:
      load_profiles:
        - "medium:4000:30000"
        - "high:8000:40000"
        - "burst:10000:30000"
      warmup_rows: 25000
      warmup_rate_schedule: "1000:25"
      batch_size: 4000
      metrics_timeout_sec: 1500
      summary_csv: artifacts/streaming/scale_up/load_quality_summary_local_extended.csv
