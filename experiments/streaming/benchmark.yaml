benchmark:
  name: fair_streaming_ids_v1
  output_root: artifacts/streaming/benchmark
  detect_script: scripts/streaming/benchmark/run_pandas_udf_benchmark.py
  detect_config: configs/streaming/detect.yaml

contracts:
  primary_latency_metric: end_to_end_p95_ms
  sustainable_throughput_metric: rows_per_second
  feature_sets: [full]
  sampling_policy: class_weight_only_no_resample
  model_profiles:
    - logistic_regression
    - random_forest
    - gradient_boosting

  fairness_layers:
    A:
      description: system_only
      varied_group: [batch_size]
      fixed:
        feature_set: full
        models: [logistic_regression]
    B:
      description: model_cost
      varied_group: [models, feature_set]
      fixed:
        batch_size: 50000
    C:
      description: stress_failure
      varied_group: [batch_size]
      fixed:
        feature_set: full
        models: [logistic_regression]

matrix:
  layer_A:
    - run_id: A_bs_20k
      layer: A
      batch_size: 20000
    - run_id: A_bs_50k
      layer: A
      batch_size: 50000
    - run_id: A_bs_100k
      layer: A
      batch_size: 100000

  layer_B:
    - run_id: B_lr_full
      layer: B
      models: [logistic_regression]
      feature_set: full
    - run_id: B_rf_full
      layer: B
      models: [random_forest]
      feature_set: full
    - run_id: B_gbt_full
      layer: B
      models: [gradient_boosting]
      feature_set: full

  layer_C:
    - run_id: C_bs_150k
      layer: C
      batch_size: 150000
    - run_id: C_bs_200k
      layer: C
      batch_size: 200000


