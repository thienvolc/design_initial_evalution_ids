# Full feature set – all 78 numeric columns from CSE-CIC-IDS2018 CSV
# (excluding Timestamp and Label metadata columns).
# Use --feature-set full to activate this registry.

keep_features:
  # identification
  - Dst Port
  - Protocol
  # volume & speed
  - Flow Duration
  - Tot Fwd Pkts
  - Tot Bwd Pkts
  - TotLen Fwd Pkts
  - TotLen Bwd Pkts
  - Flow Byts/s
  - Flow Pkts/s
  # forward packet size
  - Fwd Pkt Len Max
  - Fwd Pkt Len Min
  - Fwd Pkt Len Mean
  - Fwd Pkt Len Std
  # backward packet size
  - Bwd Pkt Len Max
  - Bwd Pkt Len Min
  - Bwd Pkt Len Mean
  - Bwd Pkt Len Std
  # inter-arrival (flow)
  - Flow IAT Mean
  - Flow IAT Std
  - Flow IAT Max
  - Flow IAT Min
  # inter-arrival (fwd)
  - Fwd IAT Tot
  - Fwd IAT Mean
  - Fwd IAT Std
  - Fwd IAT Max
  - Fwd IAT Min
  # inter-arrival (bwd)
  - Bwd IAT Tot
  - Bwd IAT Mean
  - Bwd IAT Std
  - Bwd IAT Max
  - Bwd IAT Min
  # TCP flags (push / urgent)
  - Fwd PSH Flags
  - Bwd PSH Flags
  - Fwd URG Flags
  - Bwd URG Flags
  # header length
  - Fwd Header Len
  - Bwd Header Len
  # per-direction rate
  - Fwd Pkts/s
  - Bwd Pkts/s
  # packet length (overall)
  - Pkt Len Min
  - Pkt Len Max
  - Pkt Len Mean
  - Pkt Len Std
  - Pkt Len Var
  # flag counts
  - FIN Flag Cnt
  - SYN Flag Cnt
  - RST Flag Cnt
  - PSH Flag Cnt
  - ACK Flag Cnt
  - URG Flag Cnt
  - CWE Flag Count
  - ECE Flag Cnt
  # ratio & averages
  - Down/Up Ratio
  - Pkt Size Avg
  - Fwd Seg Size Avg
  - Bwd Seg Size Avg
  # bulk statistics
  - Fwd Byts/b Avg
  - Fwd Pkts/b Avg
  - Fwd Blk Rate Avg
  - Bwd Byts/b Avg
  - Bwd Pkts/b Avg
  - Bwd Blk Rate Avg
  # subflow
  - Subflow Fwd Pkts
  - Subflow Fwd Byts
  - Subflow Bwd Pkts
  - Subflow Bwd Byts
  # window & segment
  - Init Fwd Win Byts
  - Init Bwd Win Byts
  - Fwd Act Data Pkts
  - Fwd Seg Size Min
  # active / idle
  - Active Mean
  - Active Std
  - Active Max
  - Active Min
  - Idle Mean
  - Idle Std
  - Idle Max
  - Idle Min
