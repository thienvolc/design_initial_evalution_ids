# ── Preprocessing & Training Configuration ──────────────────────────

imputer:
  numeric_strategy: median

# ── Sampling ────────────────────────────────────────────────────────
sampling:
  strategy: class_weight

# ── Models ─────────────────────────────────────────────────────────
models:
  logistic_regression:
    enabled: true
    max_iter: 1000
    C: 1.0

  random_forest:
    enabled: true
    n_estimators: 96
    max_depth: 18
    min_samples_leaf: 32
    # n_estimators: 64
    # max_depth: 16
    # min_samples_leaf: 48

  gradient_boosting:
    enabled: true
    n_estimators: 400             # more trees
    max_depth: 8                  # deeper = capture subtler Infiltration patterns
    learning_rate: 0.05           # slower learning = better generalisation
    min_samples_leaf: 20
