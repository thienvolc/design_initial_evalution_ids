runtime:
  spark:
    app_name: ids_structured_streaming
    master: local[1]
    driver_host: 127.0.0.1
    driver_bind_address: 127.0.0.1
    shuffle_partitions: 8
    arrow_enabled: true
    kafka_packages: org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1
    trigger_interval: 10 seconds
  latency:
    source_to_ingest_mode: source_timestamp

kafka:
  bootstrap_servers: kafka:29092
  input_topic: ids.raw.flows
  metrics_topic: ids.metrics
  starting_offsets: earliest
  fail_on_data_loss: false
  max_offsets_per_trigger: 20000

paths:
  input_parquet: data/gold/splits/test.parquet
  feature_manifest: artifacts/offline/preprocessing/feature_manifest.json
  feature_manifest_by_feature_set:
    full: artifacts/offline/preprocessing/feature_manifest.json
    reduced: artifacts/offline/preprocessing/feature_manifest_reduced.json
  valid_metrics_csv: artifacts/offline/models/valid_metrics.csv
  valid_metrics_csv_by_feature_set:
    full: artifacts/offline/models/valid_metrics.csv
    reduced: artifacts/offline/models/valid_metrics_reduced.csv
  prediction_artifact_dir: artifacts/streaming/predictions
  checkpoint_root: artifacts/streaming/checkpoints

models:
  - name: random_forest
    enabled: true
    joblib_path: artifacts/offline/models/random_forest.joblib
    joblib_path_by_feature_set:
      full: artifacts/offline/models/random_forest.joblib
      reduced: artifacts/offline/models/random_forest_reduced.joblib
    threshold:

  - name: logistic_regression
    enabled: true
    joblib_path: artifacts/offline/models/logistic_regression.joblib
    joblib_path_by_feature_set:
      full: artifacts/offline/models/logistic_regression.joblib
      reduced: artifacts/offline/models/logistic_regression_reduced.joblib
    threshold:

  - name: gradient_boosting
    enabled: true
    joblib_path: artifacts/offline/models/gradient_boosting.joblib
    joblib_path_by_feature_set:
      full: artifacts/offline/models/gradient_boosting.joblib
      reduced: artifacts/offline/models/gradient_boosting_reduced.joblib
    threshold:
